version: 2

models:
  - name: stg_customers
    description: "raw の顧客データを分析しやすいカラム名に整えた staging モデル。1顧客につき1行。"
    columns:
      - name: customer_id
        description: "顧客を一意に識別する主キー。"
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: "顧客の名。"
      - name: last_name
        description: "顧客の姓。"

  - name: stg_orders
    description: "raw の注文データを分析しやすいカラム名に整えた staging モデル。1注文につき1行。"
    columns:
      - name: order_id
        description: "注文を一意に識別する主キー。"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "注文した顧客のID。stg_customers.customer_id に対応する。"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: "注文日。"
        data_tests:
          - not_null
      - name: status
        description: "注文の現在ステータス。"
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
